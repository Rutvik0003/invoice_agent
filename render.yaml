# Render Blueprint: one Docker web service serving the FastAPI API, the built React frontend and Tesseract OCR.
services:
  - type: web
    name: invoice-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      # Secrets and environment-specific values: set these in the Render dashboard
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: GEMINI_MODELS
        sync: false
      # Real mode (Gmail): Google OAuth client, the only account allowed in, the token encryption key
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      # Demo mode: optional separate key/models; empty = the main Gemini key and models
      - key: DEMO_GEMINI_API_KEY
        sync: false
      - key: DEMO_GEMINI_MODEL
        sync: false
      - key: DEMO_GEMINI_MODELS
        sync: false
      - key: DEMO_MAX_RUNS_PER_HOUR
        sync: false
      # Business-rule settings: defaults live in backend/app/config.py; override here if needed
      - key: DEFAULT_MODEL
        sync: false
      - key: TOLERANCE_PCT
        sync: false
      - key: TOLERANCE_ABS_INR
        sync: false
      - key: CONFIDENCE_THRESHOLD
        sync: false
      - key: PO_INFER_MIN_SCORE
        sync: false
      - key: PO_INFER_MIN_GAP
        sync: false
      - key: PO_INFER_FLOOR
        sync: false
      - key: POSSIBLE_DUP_DAYS
        sync: false
      # Stage 3 verification (Tesseract is on PATH in the image, so TESSERACT_CMD is not needed)
      - key: VERIFY_ENABLED
        sync: false
      - key: OCR_DPI
        sync: false
      - key: OCR_MIN_WORD_CONF
        sync: false
      - key: VERIFY_FUZZY_MIN
        sync: false
